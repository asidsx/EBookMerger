name: Build & Release Desktop (.exe) and Android (.apk)

on:
  release:
    types: [created, published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================================
  # 1. BUILD WINDOWS EXECUTABLE (.EXE INSTALLER & PORTABLE)
  # ==========================================================
  build-windows:
    name: 🪟 Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --save-dev electron electron-builder --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Build Windows Executables (.exe)
        run: npx electron-builder --win --x64 --config electron-builder.json --publish never

      - name: Upload Windows Artifact to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: |
            dist_electron/*.exe
            dist_electron/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact (For Manual Workflow Runs)
        uses: actions/upload-artifact@v4
        with:
          name: BookMerger-Windows-EXE
          path: dist_electron/*.exe

  # ==========================================================
  # 2. BUILD ANDROID APPLICATION PACKAGE (.APK)
  # ==========================================================
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Bundle Web Assets into Android Project
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build Android APKs
        run: |
          cd android
          # Generate signing keystore for build
          keytool -genkey -v -keystore app/release.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=BookMerger, OU=App, O=BookMerger, L=City, S=State, C=US"
          mkdir -p ~/.android ~/.config/.android
          cp app/release.keystore ~/.android/debug.keystore
          cp app/release.keystore ~/.config/.android/debug.keystore

          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Sign and Align APKs with Uber APK Signer (v1 + v2 + v3 + v4 Schemes)
        run: |
          curl -L -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          mkdir -p release-apks
          # Run zipalign (4-byte boundary) and multi-scheme signing
          java -jar uber-apk-signer.jar --apks $(find android/app/build/outputs/apk -name "*.apk") --out release-apks/ --overwrite
          
          cd release-apks
          # Find aligned-signed release APK
          RELEASE_APK=$(find . -name "*release*aligned-signed.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" BookMerger-Android.apk
          else
            cp $(find . -name "*release*.apk" | head -n 1) BookMerger-Android.apk
          fi

          DEBUG_APK=$(find . -name "*debug*aligned-signed.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" BookMerger-Android-debug.apk
          fi
          ls -la

      - name: Upload Android APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: |
            release-apks/BookMerger-Android.apk
            release-apks/BookMerger-Android-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact (For Manual Workflow Runs)
        uses: actions/upload-artifact@v4
        with:
          name: BookMerger-Android-APK
          path: release-apks/*.apk
